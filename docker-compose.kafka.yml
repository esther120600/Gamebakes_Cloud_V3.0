# GameBakes EP3 - Cluster Kafka: 3 Zookeeper + 3 Brokers + Kafka-UI + servicio-kafka-admin
# Uso en EC2:  KAFKA_HOST=<IP_PRIVADA_EC2> docker-compose -f docker-compose.kafka.yml up -d --build
# (en local basta con: docker-compose -f docker-compose.kafka.yml up -d --build)
# Requisito: compilar antes el jar del admin:
#   cd servicios-backend/servicio-kafka-admin && ./mvnw clean package -Dmaven.test.skip=true

x-zk: &zk-common
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped

x-kafka: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped

services:
  # ---------- ZOOKEEPER ENSEMBLE (3 nodos) ----------
  zookeeper-1:
    <<: *zk-common
    container_name: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  zookeeper-2:
    <<: *zk-common
    container_name: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  zookeeper-3:
    <<: *zk-common
    container_name: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  # ---------- BROKERS (3 nodos) ----------
  # INTERNAL (kafka-N:29092): entre brokers, Kafka-UI y contenedores Docker
  # EXTERNAL (${KAFKA_HOST}:909X): microservicios fuera de la red de este compose
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  # ---------- CREACION DE TOPICS (corre una vez y termina) ----------
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init-topics
    depends_on: [kafka-1, kafka-2, kafka-3]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Esperando al cluster..."
        cub kafka-ready -b kafka-1:29092,kafka-2:29092,kafka-3:29092 3 120

        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic pagos-eventos --partitions 3 --replication-factor 3 \
          --config retention.ms=604800000 --config cleanup.policy=delete \
          --config min.insync.replicas=2

        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic pedidos-estado --partitions 3 --replication-factor 3 \
          --config cleanup.policy=compact --config min.insync.replicas=2

        kafka-topics --bootstrap-server kafka-1:29092 --list

  # ---------- KAFKA-UI ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gamebakes
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181

  # ---------- MICROSERVICIO ADMIN DE KAFKA ----------
  servicio-kafka-admin:
    build: ./servicios-backend/servicio-kafka-admin
    container_name: servicio-kafka-admin
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092