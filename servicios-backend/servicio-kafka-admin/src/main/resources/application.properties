spring.application.name=servicio-kafka-admin

server.port=8087

# --- Kafka (EP3) ---
# Desde tu PC se usan los puertos externos del cluster (9092, 9093, 9094).
# Dentro de Docker/EC2 se sobreescribe con la variable KAFKA_BOOTSTRAP_SERVERS.
gamebakes.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
gamebakes.kafka.request-timeout-ms=10000

# Valores por defecto al crear topics (los mismos del cluster)
gamebakes.kafka.default-partitions=3
gamebakes.kafka.default-replication-factor=3

logging.level.org.apache.kafka=WARN


