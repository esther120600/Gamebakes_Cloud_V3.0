spring.application.name=servicio-resenas
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gb_resenas?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.main.allow-bean-definition-overriding=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.servicio-pedidos.connectTimeout=5000
feign.client.config.servicio-pedidos.readTimeout=10000

resilience4j.circuitbreaker.instances.resenaCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.resenaCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.resenaCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.resenaCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.resenaCB.failureRateThreshold=50

resilience4j.circuitbreaker.instances.pedidoCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.pedidoCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pedidoCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.pedidoCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.pedidoCB.failureRateThreshold=50

spring.retry.max-attempts=3
spring.retry.backoff.delay=1000

spring.cache.type=simple
spring.cache.cache-names=validacionesCompra,validacionesEntregado

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=servicio-resenas-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=e41697ee-1b10-4b64-95da-b32ec0fdb9a7
spring.cloud.azure.active-directory.credential.client-id=7f32a189-8be6-4f14-92ab-9d8e80fac2bc
spring.cloud.azure.active-directory.app-id-uri=api://7f32a189-8be6-4f14-92ab-9d8e80fac2bc

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e41697ee-1b10-4b64-95da-b32ec0fdb9a7/v2.0